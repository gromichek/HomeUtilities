name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore HomeUtilities.Tests.slnf

      - name: Build
        run: dotnet build HomeUtilities.Tests.slnf -c Release --no-restore

      - name: Test
        run: dotnet test HomeUtilities.Tests.slnf -c Release --no-build --logger trx --results-directory TestResults

      - name: Report failed tests as annotations
        if: failure()
        run: python3 .github/scripts/report_trx.py TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build App (Android)
        run: dotnet build src/HomeUtilities.App -c Release -f net10.0-android

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Build App (Windows)
        run: dotnet build src/HomeUtilities.App -c Release -f net10.0-windows10.0.19041.0
